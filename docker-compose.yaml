# ----------------------------------------------------------------------
# NOTICES AND MODIFICATIONS:
# This file is a heavily modified version based on the official 
# Apache Airflow docker-compose.yaml file.
# Changes include: changed to LocalExecutor, custom Docker image,
# removed services not needed for this project, simplified airflow-init,
# and added project-specific volumes and environment variables.
# ----------------------------------------------------------------------



x-airflow-common: &airflow-common
    build: .
    image: airflow-custom:3.3.2
    environment:
        &airflow-common-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
        AIRFLOW__CORE__FERNET_KEY: ''
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
        AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    volumes:
        - ./dags:/opt/airflow/dags
        - ./logs:/opt/airflow/logs
        - ./plugins:/opt/airflow/plugins
        - ./data:/opt/airflow/data
        - ./dbt:/opt/airflow/dbt
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
        postgres:
            condition: service_healthy

services:
    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: airflow
            POSTGRES_PASSWORD: airflow
            POSTGRES_DB: airflow
        volumes:
            - postgres-db-volume:/var/lib/postgresql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "airflow"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always
    
    airflow-apiserver:
        <<: *airflow-common
        command: api-server
        ports:
            - "8080:8080"
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            airflow-init:
                condition: service_completed_successfully
    
    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        healthcheck:
            test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            airflow-init:
                condition: service_completed_successfully
    
    airflow-dag-processor:
        <<: *airflow-common
        command: dag-processor
        healthcheck:
            test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            airflow-init:
                condition: service_completed_successfully
    
    airflow-init:
        <<: *airflow-common
        entrypoint: /bin/bash
        command:
            - -c
            - |
                mkdir -p /sources/logs /sources/dags /sources/plugins
                chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
                exec /entrypoint airflow 
        environment:
            <<: *airflow-common-env
            _AIRFLOW_DB_MIGRATE: 'true'
        user: "0:0"
        volumes:
            - ${AIRFLOW_PROJ_DIR:-.}:/sources
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres-db-volume: