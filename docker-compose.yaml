# ----------------------------------------------------------------------
# NOTICES AND MODIFICATIONS:
# This file is a heavily modified version based on the official 
# Apache Airflow docker-compose.yaml file.
# Changes include: changed to LocalExecutor, custom Docker image,
# removed services not needed for this project, simplified airflow-init,
# and added project-specific volumes and environment variables.
# ----------------------------------------------------------------------



x-airflow-common: &airflow-common
    build: .
    image: airflow-custom:3.3.2
    environment:
        &airflow-common-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
        AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
        LOCATIONS: ${LOCATIONS}
        YEARS: ${YEARS}

    volumes:
        - ./dags:/opt/airflow/dags
        - ./logs:/opt/airflow/logs
        - ./plugins:/opt/airflow/plugins
        - ./data:/opt/airflow/data
        - ./dbt:/opt/airflow/dbt
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
        postgres:
            condition: service_healthy

services:
    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: airflow
            POSTGRES_PASSWORD: airflow
            POSTGRES_DB: airflow
        volumes:
            - postgres-db-volume:/var/lib/postgresql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "airflow"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always
    
    airflow-apiserver:
        <<: *airflow-common
        command: api-server
        ports:
            - "8080:8080"
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            airflow-init:
                condition: service_completed_successfully
    
    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        healthcheck:
            test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            airflow-init:
                condition: service_completed_successfully
    
    airflow-dag-processor:
        <<: *airflow-common
        command: dag-processor
        healthcheck:
            test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            airflow-init:
                condition: service_completed_successfully
    
    airflow-init:
        <<: *airflow-common
        entrypoint: /bin/bash
        command:
            - -c
            - |
                mkdir -p /sources/logs /sources/dags /sources/plugins
                chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
                exec /entrypoint airflow 
        environment:
            <<: *airflow-common-env
            _AIRFLOW_DB_MIGRATE: 'true'
        user: "0:0"
        volumes:
            - ${AIRFLOW_PROJ_DIR:-.}:/sources
        depends_on:
            postgres:
                condition: service_healthy
    
    warehouse:
        image: postgres:18
        environment:
            POSTGRES_USER: ${WAREHOUSE_USER:-admin}
            POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-admin}
            POSTGRES_DB: ${WAREHOUSE_DB:-energy_air_quality}
        volumes:
            - warehouse-db-volume:/var/lib/postgresql
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-admin} -d ${WAREHOUSE_DB:-energy_air_quality}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always
    
    metabase:
        image: metabase/metabase:v0.64-lts
        container_name: metabase
        hostname: metabase
        restart: always
        ports:
            - "3000:3000"
        environment:
            MB_DB_TYPE: postgres
            MB_DB_DBNAME: ${WAREHOUSE_DB:-energy_air_quality}
            MB_DB_PORT: 5432
            MB_DB_USER: ${WAREHOUSE_USER:-admin}
            MB_DB_HOST: warehouse
            MB_DB_PASS: ${WAREHOUSE_PASSWORD:-admin}
            JAVA_TIMEZONE: "Etc/UTC"
        volumes:
            - metabase-volume:/metabase-data
        depends_on:
            - 'warehouse'
        healthcheck:
            test: curl --fail -I http://localhost:3000/api/health || exit 1
            interval: 15s
            timeout: 5s
            retries: 5

volumes:
    postgres-db-volume:
    warehouse-db-volume:
    metabase-volume:
